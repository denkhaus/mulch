# Local development toolset, managed by mise. Mirrors the SHARED
# toolchain image (ghcr.io/denkhaus/seeds-toolchain, owned and built by
# denkhaus/seeds — this repo deliberately owns no Dockerfile; the
# server-managed `mulch-toolchain` environment pins that image). The
# Rust toolchain is owned by rustup (pinned nightly-2026-09-22, see
# AGENTS.md). The tracker is the external `seeds` binary (denkhaus/
# seeds), per-repo pinned via the cargo backend (curl install script
# for other machines: https://github.com/denkhaus/seeds/releases).

[tools]
just = "1.58.0"
bun = "1.4.0"
"aqua:nushell/nushell" = "0.115.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
# The pre-push gate's activator (lefthook.yml is repo config, so the
# binary is repo-pinned too — keeps `just bootstrap` self-contained).
# The binary alone installs no hooks; the operator opt-in stays the
# bootstrap recipe, and runs never call it (see lefthook.yml).
lefthook = "2.1.14"
# The npm mulch CLI pin was REMOVED at the self-hosting cutover
# (ADR-0007) — and parity itself dissolved shortly after (ADR-0008):
# no tool in this repo runs the old binary any more. The pin also
# shadowed ours: the npm package ships its own `mulch` and mise's
# shims precede ~/.cargo/bin on PATH. `mulch` = `just install`.

# The GitButler CLI (`but`) pin lived here until the experiment was
# retired (2026-10-17, mulch-6817) — the checkout runs plain git now.
"cargo:seeds" = "0.10.0"

[settings.npm]
# Non-TTY installs abort on the default backend's interactive approval
# prompt; bun is the verified path for these script-less CLIs.
package_manager = "bun"
