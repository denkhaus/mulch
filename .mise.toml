# Local development toolset, managed by mise. Mirrors the SHARED
# toolchain image (ghcr.io/denkhaus/seeds-toolchain, owned and built by
# denkhaus/seeds — this repo deliberately owns no Dockerfile; the
# server-managed `mulch-toolchain` environment pins that image). The
# Rust toolchain is owned by rustup (pinned nightly-2026-09-22, see
# AGENTS.md). The tracker is the external `seeds` binary (denkhaus/
# seeds): globally installed already, on PATH — no mise entry needed
# (curl install script: https://github.com/denkhaus/seeds/releases).

[tools]
just = "1.58.0"
bun = "1.4.0"
"aqua:nushell/nushell" = "0.115.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
# Bootstrap phase remainder (ADR-0023 in denkhaus/fabro): the jayminwest
# mulch CLI, the read+write compatible expertise target, until this
# repo's own `mulch` binary replaces it at the self-hosting cutover.
"npm:@os-eco/mulch-cli" = "0.10.7"

# GitButler CLI (but) — pinned via http backend (no registry entry: GitHub
# releases carry no assets; the artifact comes from releases.gitbutler.com,
# see app.gitbutler.com/releases/version/<v>). 0.22.3-3234 is the build the
# fabro GitButler experiment validated (2026-10-03). Same pin as the
# global ~/.config/mise/config.toml entry; the per-repo pin makes the
# dependency explicit for this checkout.
"http:but" = { version = "0.22.3-fork.1", url = "https://github.com/denkhaus/gitbutler/releases/download/v0.22.3-fork.1/but-0.22.3-fork.1-x86_64-unknown-linux-gnu.tar.gz" }

[settings.npm]
# Non-TTY installs abort on the default backend's interactive approval
# prompt; bun is the verified path for these script-less CLIs.
package_manager = "bun"
